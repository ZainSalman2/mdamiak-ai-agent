name: MdaMiak AI Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Arabic Engine & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libraqm-dev
          pip install google-genai pillow requests

      - name: Run MdaMiak Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agent.py

      - name: Upload Generated Post
        uses: actions/upload-artifact@v4
        with:
          name: mdamiak-daily-post
          path: output/
