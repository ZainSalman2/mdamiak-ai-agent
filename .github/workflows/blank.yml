name: Daily AI Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Arabic Engine & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libraqm-dev libfribidi-dev libharfbuzz-dev
          pip install --upgrade pip
          pip install requests pillow arabic-reshaper python-bidi google-genai

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          python agent.py
